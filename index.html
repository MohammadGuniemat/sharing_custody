<!DOCTYPE html>
<html lang="ar">
<head>

    <style>
        * { font-family: 'Cairo', sans-serif; direction: rtl; box-sizing: border-box; }
        body { margin: 0; background: #f4f6f9; }

        .header {
            background: #004aad;
            color: white;

        }

            color: white;
            padding: 15px;
            text-align: center;
            font-size: 13px;

        bottom:0;
        }

</div>
