<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة إرجاع المواد</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<style>
    * { direction: rtl; font-family: 'Cairo', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #f4f6f9; }

    .header {
        background: #8B0000;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .content {
        background: white;
        width: 95%;
        max-width: 900px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }

    fieldset {
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 15px;
    }

    legend {
        font-weight: 600;
        color: #8B0000;
    }

    label {
        font-weight: 600;
        margin-bottom: 5px;
        display: block;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
    }

    .row { display: flex; gap: 15px; }
    .row > div { flex: 1; }

    .readonly { background: #eee; }

    button {
        background: #8B0000;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    button.secondary {
        background: #555;
    }
</style>
</head>

<body>

<div class="header">
    <h1>شاشة إرجاع المواد</h1>
    <p>تقاعد / إنهاء الخدمة / انتهاء الغاية من الاستخدام</p>
</div>

<div class="content">

<form>

<!-- بيانات الموظف -->
<fieldset>
    <legend>بيانات الموظف</legend>

    <div class="row">
        <div>
            <label>رقم الموظف (بحث)</label>
            <input type="text" placeholder="أدخل رقم الموظف">
        </div>
        <div>
            <label>اسم الموظف (استرجاع)</label>
            <input class="readonly" readonly>
        </div>
    </div>

    <label>سبب الإرجاع</label>
    <select required>
        <option>تقاعد</option>
        <option>إنهاء خدمة</option>
        <option>انتهاء الغاية من الاستخدام</option>
        <option>نقل موظف</option>
    </select>
</fieldset>

<!-- بيانات المادة -->
<fieldset>
    <legend>بيانات المادة المُعادة</legend>

    <div class="row">
        <div>
            <label>رقم المادة (بحث)</label>
            <input type="text">
        </div>
        <div>
            <label>اسم المادة</label>
            <input class="readonly" readonly>
        </div>
    </div>

    <label>وصف المادة</label>
    <textarea class="readonly" readonly></textarea>

    <div class="row">
        <div>
            <label>الكمية المُعادة</label>
            <input type="number" min="1" required>
        </div>
        <div>
            <label>الوحدة</label>
            <input class="readonly" readonly>
        </div>
    </div>

    <label>حالة المادة عند الإرجاع</label>
    <select required>
        <option>جيدة</option>
        <option>تحتاج صيانة</option>
        <option>تالفة</option>
        <option>مفقودة جزئيًا</option>
    </select>
</fieldset>

<!-- الاعتماد والمرفقات -->
<fieldset>
    <legend>الاعتماد والتوثيق</legend>

    <label>ملاحظات</label>
    <textarea rows="3"></textarea>

    <label>مرفق توقيع الإرجاع (إجباري)</label>
    <input type="file" accept="image/*" required>
</fieldset>

<button type="submit">تأكيد إرجاع المادة</button>
<button type="button" class="secondary">طباعة نموذج إرجاع</button>

</form>

</div>

</body>
</html>
